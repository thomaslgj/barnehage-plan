name: Mobile CI/CD

on:
  push:
    branches: [main, v2]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, v2]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          flags: mobile
          directory: apps/mobile/coverage
        continue-on-error: true

  # EAS Update for quick JS/CSS changes (no native code)
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Publish update
        run: eas update --branch production --message "${{ github.event.head_commit.message }}"

  # Build full native app (run manually or on release)
  build-preview:
    name: EAS Build Preview
    runs-on: ubuntu-latest
    needs: test
    # Only run on pull requests
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build preview (iOS)
        run: eas build --platform ios --profile preview --non-interactive --no-wait
        continue-on-error: true

      - name: 🚀 Build preview (Android)
        run: eas build --platform android --profile preview --non-interactive --no-wait
        continue-on-error: true
